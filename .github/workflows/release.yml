name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (e.g. 1.0.0)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source, version and tests
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      marketing_version: ${{ steps.version.outputs.marketing_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify version against Xcode MARKETING_VERSION
        id: version
        run: |
          set -euo pipefail
          marketing_version="$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/p' BentoZip.xcodeproj/project.pbxproj | head -n1 | tr -d '[:space:]')"
          if [ -z "$marketing_version" ]; then
            echo "::error::Could not parse MARKETING_VERSION from BentoZip.xcodeproj/project.pbxproj"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$marketing_version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match MARKETING_VERSION (${marketing_version})"
              exit 1
            fi
            release_version="$tag_version"
          else
            input_version="${{ inputs.version }}"
            release_version="${input_version:-$marketing_version}"
            release_version="${release_version#v}"
          fi

          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "marketing_version=${marketing_version}" >> "$GITHUB_OUTPUT"
          echo "Verifying BentoZip ${release_version} (MARKETING_VERSION=${marketing_version})"

      - name: Check for prohibited middle dot characters
        run: |
          if grep -rnI --include="*.swift" "·" BentoZip/ BentoZipCore/ BentoZipTests/ BentoZipQuickLook/ BentoZipFinderExtension/ BentoZipSpotlight/; then
            echo "::error::Found prohibited middle dot character (·) in source files"
            exit 1
          fi

      - name: Cache bento7z dependencies
        uses: actions/cache@v4
        with:
          path: engine/bento7z/build/_deps
          key: bento7z-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/bento7z/CMakeLists.txt') }}

      - name: Build bento7z engine
        run: ./scripts/build-engine.sh

      - name: Build BentoZipCore Swift package
        run: cd BentoZipCore && swift build -Xswiftc -warnings-as-errors

      - name: Run BentoZip unit tests
        run: xcodebuild -project BentoZip.xcodeproj -scheme BentoZip -configuration Debug -only-testing:BentoZipTests test

  verify_website:
    name: Verify website build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install website dependencies
        run: pnpm --dir website install --frozen-lockfile || pnpm --dir website install

      - name: Build website
        run: pnpm --dir website build

  build:
    name: Build macOS Universal release
    needs: [verify, verify_website]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache bento7z dependencies
        uses: actions/cache@v4
        with:
          path: engine/bento7z/build/_deps
          key: bento7z-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/bento7z/CMakeLists.txt') }}

      - name: Check macOS signing configuration
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in CERT_P12 CERT_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          for name in MACOS_DEVELOPER_ID APPLE_TEAM_ID APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Apple Developer ID signing and notarization secrets configured."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets missing ($missing). Building unsigned release artifacts."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build Universal release artifacts
        run: ./scripts/build-release.sh --universal
        env:
          VERSION: ${{ needs.verify.outputs.release_version }}
          CODESIGN: ${{ steps.signing.outputs.enabled == 'true' && '1' || '0' }}
          NOTARIZE: ${{ steps.signing.outputs.enabled == 'true' && '1' || '0' }}

      - name: Verify signature and notarization
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          APP="build/stage/BentoZip.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Staged app bundle not found at $APP"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q "Authority=Developer ID Application" "$RUNNER_TEMP/codesign.txt"
          spctl -a -vvv -t exec "$APP"
          xcrun stapler validate "$APP"

          DMG="$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$DMG" ]; then
            echo "::error::DMG artifact not found in dist/"
            exit 1
          fi
          xcrun stapler validate "$DMG"

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BentoZip-${{ needs.verify.outputs.release_version }}-macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: BentoZip-${{ needs.verify.outputs.release_version }}-macos-universal
          path: release-assets

      - name: Verify and regenerate checksums
        run: |
          set -euo pipefail
          cd release-assets
          rm -f SHA256SUMS.txt
          sha256sum *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.release_version }}"
          marketing_version="${{ needs.verify.outputs.marketing_version }}"
          extract_notes() {
            awk -v version="$1" '
              $0 ~ "^## \\[" version "\\]" { capture = 1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md
          }
          extract_notes "$version" > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ] && [ "$version" != "$marketing_version" ]; then
            extract_notes "$marketing_version" > "$RUNNER_TEMP/release-notes.md"
          fi
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "BentoZip ${GITHUB_REF_NAME}" > "$RUNNER_TEMP/release-notes.md"
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: BentoZip ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
